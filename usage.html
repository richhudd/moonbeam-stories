<!doctype html>
<meta name="viewport" content="width=device-width">
<title>Moonbeam Usage</title>
<link rel="stylesheet" href="/styles.css?v=250.30">
<main class="usage-page">
  <h1>Moonbeam developer usage</h1>
  <section class="usage-section usage-baseline-section support-inbox-section">
  <div class="usage-section-head"><h2>Support inbox</h2><p>Read messages sent to Moonbeam support/privacy and reply without exposing your personal email address.</p></div>
  <div id="supportInbox"><p>Loading support inbox…</p></div>
</section>
  <div id="u">Loading…</div>
<p><a href="/">← Moonbeam</a></p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(async()=>{
 const u=document.getElementById('u');
 const c=supabase.createClient('https://quwjfjojeibaxnnpykaf.supabase.co','sb_publishable_fF-Pc61g82cwksFta61dow_lRpWuX4q');
 const s=(await c.auth.getSession()).data.session;
 if(!s){u.textContent='Sign into Moonbeam first';return}
 window.moonbeamDeveloperSession=s;
  const r=await fetch('/api/usage-summary',{headers:{Authorization:'Bearer '+s.access_token}});
 const d=await r.json(); if(!r.ok){u.textContent=d.error||'Could not load usage';return}

 const money=n=>n==null?'—':'$'+Number(n).toFixed(4);
 const num=n=>n==null?'—':Number(n).toLocaleString('en-GB');
 const when=v=>new Date(v).toLocaleString('en-GB',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',timeZone:'Europe/London',timeZoneName:'short'});
 const moonbeamBaseline=when(d.moonbeam?.baselineUTC||d.baselineUTC);
 const fictionBaseline=when(d.fiction?.baselineUTC||d.fictionBaselineUTC);
 const allTimeStart=when(d.allTimeStartUTC);
 const M=d.moonbeam?.periods||d.periods||{};
 const F=d.fiction?.periods||{};
 const moonbeamCols=[['allTime','All-time'],['sinceBaseline','Overall since reset'],['developerSinceBaseline','Developer since reset'],['otherUsersSinceBaseline','Other users since reset'],['thisMonth','This month'],['today','Today'],['yesterday','Yesterday'],['last7Days','Last 7 days']];
 const fictionCols=[['allTime','All-time'],['sinceBaseline','Since reset'],['thisMonth','This month'],['today','Today'],['yesterday','Yesterday'],['last7Days','Last 7 days']];
 const row=(periods,cols,label,key,fmt=num)=>`<tr><th>${label}</th>${cols.map(([k])=>`<td>${fmt(periods[k]?.[key])}</td>`).join('')}</tr>`;
 const users=(d.users||[]);
 const userRows=users.length?users.map(x=>`
   <tr>
    <td>${esc(x.email||'—')}</td>
    <td>${x.createdAt?new Date(x.createdAt).toLocaleString('en-GB'):'—'}</td>
    <td>${x.lastSignInAt?new Date(x.lastSignInAt).toLocaleString('en-GB'):'—'}</td>
    <td>${num(x.storiesGenerated)}</td>
    <td>${x.lastGenerationAt?new Date(x.lastGenerationAt).toLocaleString('en-GB'):'—'}</td>
   </tr>`).join(''):`<tr><td colspan="5">No registered users found.</td></tr>`;

 const support=(d.supportAttempts||[]);
 const supportRows=support.length?support.map(a=>`
   <tr>
    <td>${new Date(a.createdAt).toLocaleString('en-GB')}</td>
    <td>${esc(a.email)}</td><td>${esc(a.status)}</td>
    <td>${a.creditDeducted?'Yes':'No'}</td><td>${a.creditRefunded?'Yes':'No'}</td>
    <td>${a.imagesGenerated}</td><td>${esc(a.errorCode||'—')}</td>
    <td>${a.durationMs?Math.round(a.durationMs/1000)+'s':'—'}</td>
   </tr>`).join(''):`<tr><td colspan="8">No generation attempts logged yet. New attempts will appear here from V239 onward.</td></tr>`;

 const costNote=d.openai?.available
   ? `Costs are split between the two products. ${esc(d.openai?.splitMethod||'')}`
   : `<strong>OpenAI cost unavailable:</strong> ${esc(d.openai?.error||'Unknown error')}`;

 u.innerHTML=`
  <section class="usage-section">
   <div class="usage-section-head"><h2>Moonbeam Stories</h2><p>Reset baseline: ${moonbeamBaseline}. Historical totals are preserved. Resetting this section also restarts the Moonbeam story-generation timing baseline.</p><button id="resetMoonbeamBaseline" class="secondary usage-reset-baseline" type="button">Reset Moonbeam Stories</button></div>
   <div class="usage-table-wrap"><table class="usage-economics">
    <thead><tr><th>Metric</th>${moonbeamCols.map(([,label])=>`<th>${label}</th>`).join('')}</tr></thead>
    <tbody>
     ${row(M,moonbeamCols,'Stories','stories')}
     ${row(M,moonbeamCols,'Images','images')}
     ${row(M,moonbeamCols,'Narrations','narrations')}
     ${row(M,moonbeamCols,'OpenAI cost','openAICostUSD',money)}
     ${row(M,moonbeamCols,'Cost / story','averageStoryCostUSD',money)}
    </tbody>
   </table></div>
   <p class="${d.openai?.available?'usage-note':'usage-warning'}">${costNote}</p>
   <p class="usage-note"><strong>All-time</strong> is fixed from ${allTimeStart}. Registered accounts: <strong>${num(M.allTime?.registeredUsers)}</strong>.</p>
  </section>

  <section class="usage-section">
   <div class="usage-section-head"><h2>Adult Novel Studio</h2><p>Reset baseline: ${fictionBaseline}. This reset is completely independent of Moonbeam Stories and does not delete historical usage.</p><button id="resetFictionBaseline" class="secondary usage-reset-baseline" type="button">Reset Adult Novel Studio</button></div>
   <div class="usage-table-wrap"><table class="usage-economics">
    <thead><tr><th>Metric</th>${fictionCols.map(([,label])=>`<th>${label}</th>`).join('')}</tr></thead>
    <tbody>
     ${row(F,fictionCols,'AI requests','requests')}
     ${row(F,fictionCols,'Input tokens','inputTokens')}
     ${row(F,fictionCols,'Output tokens','outputTokens')}
     ${row(F,fictionCols,'OpenAI cost','openAICostUSD',money)}
    </tbody>
   </table></div>
   <p class="usage-note">Adult Novel Studio cost is calculated directly from its recorded model/token usage. It is kept separate from Moonbeam Stories throughout this dashboard.</p>
  </section>

  <section class="usage-section usage-baseline-section">
   <div class="usage-section-head"><h2>Users</h2><p>All registered Moonbeam accounts. Story counts are successful Moonbeam Stories generation events recorded against each account.</p></div>
   <div class="usage-table-wrap"><table class="usage-users">
    <thead><tr><th>Account</th><th>Joined</th><th>Last sign-in</th><th>Stories generated</th><th>Last generation</th></tr></thead>
    <tbody>${userRows}</tbody>
   </table></div>
  </section>

  <section class="usage-section usage-baseline-section">
   <div class="usage-section-head"><h2>Generation support log</h2><p>Operational evidence for Moonbeam Stories refund/support queries. Story text and user prompts are not stored here.</p></div>
   <div class="usage-table-wrap"><table class="usage-support">
    <thead><tr><th>Time</th><th>Account</th><th>Result</th><th>Credit deducted</th><th>Credit refunded</th><th>Images</th><th>Error</th><th>Duration</th></tr></thead>
    <tbody>${supportRows}</tbody>
   </table></div>
  </section>`;

 async function resetProductBaseline(button,action,label){
  if(!confirm(`Reset ${label} usage baseline?\n\nUsage since reset will restart from now. Historical records will not be deleted.`))return;
  button.disabled=true;const old=button.textContent;button.textContent='Resetting…';
  try{
   const rr=await fetch('/api/usage-summary',{method:'POST',headers:{Authorization:'Bearer '+s.access_token,'Content-Type':'application/json'},body:JSON.stringify({action})});
   const rd=await rr.json();if(!rr.ok)throw new Error(rd.error||'Could not reset baseline.');location.reload();
  }catch(e){alert(e.message||String(e));button.disabled=false;button.textContent=old}
 }
 const resetMoonbeam=document.getElementById('resetMoonbeamBaseline');
 if(resetMoonbeam)resetMoonbeam.onclick=()=>resetProductBaseline(resetMoonbeam,'reset-moonbeam-baseline','Moonbeam Stories');
 const resetFiction=document.getElementById('resetFictionBaseline');
 if(resetFiction)resetFiction.onclick=()=>resetProductBaseline(resetFiction,'reset-fiction-baseline','Adult Novel Studio');

 async function loadSupportInbox(){
  const box=document.getElementById('supportInbox'); if(!box)return;
  const token=window.moonbeamDeveloperSession?.access_token; if(!token){box.innerHTML='<p>Sign into Moonbeam first.</p>';return}
  try{
   const r=await fetch('/api/resend-inbound?action=list',{headers:{Authorization:'Bearer '+token}}); const d=await r.json();
   if(!r.ok)throw new Error(d.error||'Could not load support inbox.');
   const messages=d.messages||[];
   if(!messages.length){box.innerHTML='<p class="usage-note">No support or privacy messages found.</p>';return}
   box.innerHTML=`<div class="support-inbox-layout"><div class="support-message-list">${messages.map(m=>`<button class="support-message-row" data-id="${esc(m.id)}"><strong>${esc(m.from||'Unknown sender')}</strong><span>${esc(m.subject||'(No subject)')}</span><small>${m.createdAt?new Date(m.createdAt).toLocaleString('en-GB'):'—'} · ${esc(m.mailbox||'')}</small></button>`).join('')}</div><div id="supportMessagePane" class="support-message-pane"><p class="usage-note">Select a message to read it and reply.</p></div></div>`;
   box.querySelectorAll('.support-message-row').forEach(b=>b.onclick=()=>openSupportMessage(b.dataset.id,b));
  }catch(e){box.innerHTML=`<p class="usage-warning">${esc(e.message||String(e))}</p>`}
 }
 async function openSupportMessage(id,button){
  document.querySelectorAll('.support-message-row').forEach(x=>x.classList.toggle('active',x===button));
  const pane=document.getElementById('supportMessagePane'); pane.innerHTML='<p>Loading message…</p>';
  try{
   const token=window.moonbeamDeveloperSession.access_token;
   const r=await fetch('/api/resend-inbound?action=message&id='+encodeURIComponent(id),{headers:{Authorization:'Bearer '+token}}); const d=await r.json();
   if(!r.ok)throw new Error(d.error||'Could not load message.'); const m=d.message;
   const plain=String(m.text||'').trim();
   const html=String(m.html||'').trim();
   const body=plain?`<pre class="support-message-text">${esc(plain)}</pre>`:(html?`<iframe id="supportMessageHtml" class="support-message-html" sandbox="" title="Email body"></iframe>`:'<p class="usage-note">This message has no readable body.</p>');
   pane.innerHTML=`<div class="support-message-meta"><strong>${esc(m.subject||'(No subject)')}</strong><span>From: ${esc(m.from||'—')}</span><span>To: ${esc((m.to||[]).join(', '))}</span><span>${m.createdAt?new Date(m.createdAt).toLocaleString('en-GB'):'—'}</span></div>${body}<form id="supportReplyForm" class="support-reply"><label><strong>Reply as Richard — Moonbeam Stories &lt;richard@moonbeamstories.co.uk&gt;</strong>${m.replyAddress?`<span class="support-reply-to">To: ${esc(m.replyAddress)}</span>`:''}<textarea id="supportReplyText" rows="7" placeholder="Type your reply…" required></textarea></label><div class="support-reply-actions"><button class="primary" type="submit">Send reply</button><span id="supportReplyStatus"></span></div></form>`;
   if(!plain&&html){const frame=document.getElementById('supportMessageHtml');if(frame)frame.srcdoc=`<style>html,body,body *{color:#000 !important}</style>${html}`;}
   document.getElementById('supportReplyForm').onsubmit=async e=>{e.preventDefault();await sendSupportReply(id,m.mailbox)};
  }catch(e){pane.innerHTML=`<p class="usage-warning">${esc(e.message||String(e))}</p>`}
 }
 async function sendSupportReply(sourceId,mailbox){
  const text=document.getElementById('supportReplyText').value.trim(), status=document.getElementById('supportReplyStatus'), button=document.querySelector('#supportReplyForm button');
  if(!text)return; button.disabled=true; status.textContent='Sending…';
  try{
   const token=window.moonbeamDeveloperSession.access_token;
   const r=await fetch('/api/resend-inbound?action=reply',{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({sourceId,text})}); const d=await r.json();
   if(!r.ok)throw new Error(d.error||'Could not send reply.'); status.textContent=`✓ Sent from ${d.from}`; document.getElementById('supportReplyText').value='';
  }catch(e){status.textContent=e.message||String(e)}finally{button.disabled=false}
 }
 loadSupportInbox();

 function esc(v){return String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
})()
</script>
