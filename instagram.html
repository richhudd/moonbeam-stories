<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17132d"><title>Moonbeam Stories — Story Gallery</title><link rel="stylesheet" href="/styles.css?v=250.33"><style>body{min-height:100vh;background:#17132d;color:#fff;margin:0}.ig-gallery-shell{max-width:1100px;margin:auto;padding:30px 18px 70px;text-align:center}.ig-gallery-brand{font-size:26px;font-weight:800}.ig-gallery-shell h1{font-size:clamp(28px,4vw,44px);margin:14px 0 7px}.ig-gallery-intro{opacity:.82;margin:0 auto 24px;max-width:620px}.ig-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:18px 14px;align-items:start}.ig-card{display:flex;flex-direction:column;align-items:center;text-decoration:none;color:#fff;min-width:0}.ig-card:hover img{transform:translateY(-2px)}.ig-card img{display:block;width:112px;height:142px;aspect-ratio:112/142;object-fit:cover;background:#30284d;border-radius:12px;box-shadow:0 7px 18px #0006;transition:transform .18s}.ig-card div{width:128px;padding:8px 0 0;text-align:center}.ig-card strong{display:block;font:700 14px/1.2 Georgia,'Times New Roman',serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ig-card span{display:block;margin-top:3px;color:#cbbcff;font-size:11px;font-weight:700}.ig-empty{opacity:.75;padding:50px 0}.ig-create{display:inline-block;margin-top:34px;padding:14px 22px;border-radius:999px;background:#fff;color:#3d315f;text-decoration:none;font-weight:800}@media(max-width:700px){.ig-gallery-shell{padding:24px 12px 60px}.ig-grid{grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:16px 8px}.ig-card img{width:94px;height:119px;border-radius:10px}.ig-card div{width:104px}.ig-card strong{font-size:12px}.ig-card span{font-size:10px}}</style></head><body><main class="ig-gallery-shell"><div class="ig-gallery-brand">☾ Moonbeam Stories</div><h1>Read a Moonbeam Story</h1><p class="ig-gallery-intro">Choose a story below to read the complete illustrated book. At the end, you can create an adventure starring your own child.</p><div id="gallery" class="ig-grid"><p class="ig-empty">Loading stories…</p></div><a class="ig-create" href="/">Create your own story</a></main><script>const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));(async()=>{const box=document.getElementById('gallery');try{const r=await fetch('/api/share?action=instagram-gallery');const d=await r.json();if(!r.ok)throw new Error(d.error||'Could not load stories.');if(!d.stories?.length){box.innerHTML='<p class="ig-empty">Stories are coming soon.</p>';return}box.innerHTML=d.stories.map(x=>`<a class="ig-card" href="${esc(x.readerUrl)}"><img src="${esc(x.coverUrl)}" alt="${esc(x.title)}"><div><strong>${esc(x.title)}</strong><span>Read the story →</span></div></a>`).join('')}catch(e){box.innerHTML='<p class="ig-empty">The story gallery is temporarily unavailable.</p>'}})();</script></body></html>
