<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17132d"><title>Moonbeam Stories — Story Gallery</title><link rel="stylesheet" href="/styles.css?v=250.29"><style>body{min-height:100vh;background:#17132d;color:#fff;margin:0}.ig-gallery-shell{max-width:1100px;margin:auto;padding:36px 20px 70px;text-align:center}.ig-gallery-brand{font-size:28px;font-weight:800}.ig-gallery-shell h1{font-size:clamp(30px,5vw,54px);margin:18px 0 8px}.ig-gallery-intro{opacity:.82;margin:0 auto 30px;max-width:620px}.ig-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:22px}.ig-card{display:block;background:#fff;border-radius:20px;overflow:hidden;text-decoration:none;color:#251f37;box-shadow:0 14px 35px #0005;text-align:left;transition:transform .18s}.ig-card:hover{transform:translateY(-3px)}.ig-card img{display:block;width:100%;aspect-ratio:1/1.28;object-fit:cover;background:#30284d}.ig-card div{padding:14px 16px 17px}.ig-card strong{display:block;font-size:18px}.ig-card span{display:block;margin-top:5px;color:#6b55a3;font-weight:700}.ig-empty{opacity:.75;padding:50px 0}.ig-create{display:inline-block;margin-top:34px;padding:14px 22px;border-radius:999px;background:#fff;color:#3d315f;text-decoration:none;font-weight:800}</style></head><body><main class="ig-gallery-shell"><div class="ig-gallery-brand">☾ Moonbeam Stories</div><h1>Read a Moonbeam Story</h1><p class="ig-gallery-intro">Choose a story below to read the complete illustrated book. At the end, you can create an adventure starring your own child.</p><div id="gallery" class="ig-grid"><p class="ig-empty">Loading stories…</p></div><a class="ig-create" href="/">Create your own story</a></main><script>const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));(async()=>{const box=document.getElementById('gallery');try{const r=await fetch('/api/share?action=instagram-gallery');const d=await r.json();if(!r.ok)throw new Error(d.error||'Could not load stories.');if(!d.stories?.length){box.innerHTML='<p class="ig-empty">Stories are coming soon.</p>';return}box.innerHTML=d.stories.map(x=>`<a class="ig-card" href="${esc(x.readerUrl)}"><img src="${esc(x.coverUrl)}" alt="${esc(x.title)}"><div><strong>${esc(x.title)}</strong><span>Read the story →</span></div></a>`).join('')}catch(e){box.innerHTML='<p class="ig-empty">The story gallery is temporarily unavailable.</p>'}})();</script></body></html>
