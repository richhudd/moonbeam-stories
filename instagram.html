<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17132d"><title>Moonbeam Stories — Story Gallery</title><link rel="stylesheet" href="/styles.css?v=250.34"><style>body{min-height:100vh;background:#17132d;color:#fff;margin:0}.ig-gallery-shell{max-width:1100px;margin:auto;padding:30px 18px 70px;text-align:center}.ig-gallery-brand{font-size:26px;font-weight:800}.ig-gallery-shell h1{font-size:clamp(28px,4vw,44px);margin:14px 0 7px}.ig-gallery-intro{opacity:.82;margin:0 auto 24px;max-width:620px}.ig-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:18px 14px;align-items:start}.ig-wrap{display:flex;flex-direction:column;align-items:center;min-width:0}.ig-card{display:flex;flex-direction:column;align-items:center;text-decoration:none;color:#fff;min-width:0}.ig-card:hover img{transform:translateY(-2px)}.ig-card img{display:block;width:112px;height:142px;aspect-ratio:112/142;object-fit:cover;background:#30284d;border-radius:12px;box-shadow:0 7px 18px #0006;transition:transform .18s}.ig-card div{width:128px;padding:8px 0 0;text-align:center}.ig-card strong{display:block;font:700 14px/1.2 Georgia,'Times New Roman',serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ig-card span{display:block;margin-top:3px;color:#cbbcff;font-size:11px;font-weight:700}.ig-remove{display:none;margin-top:7px;border:1px solid #ffffff55;background:#ffffff12;color:#fff;border-radius:999px;padding:5px 9px;font:700 10px/1.2 system-ui,sans-serif;cursor:pointer}.developer .ig-remove{display:inline-block}.ig-remove:hover{background:#ffffff22}.ig-remove:disabled{opacity:.55;cursor:default}.ig-empty{opacity:.75;padding:50px 0}.ig-create{display:inline-block;margin-top:34px;padding:14px 22px;border-radius:999px;background:#fff;color:#3d315f;text-decoration:none;font-weight:800}@media(max-width:700px){.ig-gallery-shell{padding:24px 12px 60px}.ig-grid{grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:16px 8px}.ig-card img{width:94px;height:119px;border-radius:10px}.ig-card div{width:104px}.ig-card strong{font-size:12px}.ig-card span{font-size:10px}}</style></head><body><main class="ig-gallery-shell"><div class="ig-gallery-brand">☾ Moonbeam Stories</div><h1>Read a Moonbeam Story</h1><p class="ig-gallery-intro">Choose a story below to read the complete illustrated book. At the end, you can create an adventure starring your own child.</p><div id="gallery" class="ig-grid"><p class="ig-empty">Loading stories…</p></div><a class="ig-create" href="/">Create your own story</a></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let developerToken='';
async function detectDeveloper(){try{const c=supabase.createClient('https://quwjfjojeibaxnnpykaf.supabase.co','sb_publishable_fF-Pc61g82cwksFta61dow_lRpWuX4q');const session=(await c.auth.getSession()).data.session;if(!session)return;const r=await fetch('/api/resend-inbound?action=instagram-access',{headers:{Authorization:'Bearer '+session.access_token}});if(r.ok){developerToken=session.access_token;document.body.classList.add('developer')}}catch{}}
async function removeEntry(button,id){if(!developerToken||!id)return;if(!confirm('Remove this story from the public Instagram gallery? The saved Moonbeam story will not be deleted.'))return;button.disabled=true;button.textContent='Removing…';try{const r=await fetch('/api/resend-inbound?action=instagram-gallery-remove',{method:'POST',headers:{Authorization:'Bearer '+developerToken,'Content-Type':'application/json'},body:JSON.stringify({shareId:id})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Could not remove story.');button.closest('.ig-wrap').remove();if(!document.querySelector('.ig-wrap'))document.getElementById('gallery').innerHTML='<p class="ig-empty">Stories are coming soon.</p>'}catch(e){alert(e.message||'Could not remove story.');button.disabled=false;button.textContent='Remove from gallery'}}
(async()=>{const box=document.getElementById('gallery');await detectDeveloper();try{const r=await fetch('/api/share?action=instagram-gallery');const d=await r.json();if(!r.ok)throw new Error(d.error||'Could not load stories.');if(!d.stories?.length){box.innerHTML='<p class="ig-empty">Stories are coming soon.</p>';return}box.innerHTML=d.stories.map(x=>`<div class="ig-wrap"><a class="ig-card" href="${esc(x.readerUrl)}"><img src="${esc(x.coverUrl)}" alt="${esc(x.title)}"><div><strong>${esc(x.title)}</strong><span>Read the story →</span></div></a><button class="ig-remove" type="button" data-id="${esc(x.shareId)}">Remove from gallery</button></div>`).join('');box.querySelectorAll('.ig-remove').forEach(b=>b.addEventListener('click',()=>removeEntry(b,b.dataset.id)))}catch(e){box.innerHTML='<p class="ig-empty">The story gallery is temporarily unavailable.</p>'}})();
</script></body></html>
